[project]
name = "iec-ec-bridge"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
  "Django>=5.2,<5.3",
  "gunicorn>=23",
  "psycopg[binary]>=3.2",
  "dj-database-url>=2.3",
  "requests>=2.32",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "config.settings"
